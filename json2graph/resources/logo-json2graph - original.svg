    <line x1="110" y1="205" x2="175" y2="92" stroke="#EF551F" stroke-width="20" stroke-linecap="round" />
    <line x1="175" y1="92" x2="305" y2="92" stroke="#EF551F" stroke-width="20" stroke-linecap="round" />
    <line x1="110" y1="205" x2="175" y2="318" stroke="#EF551F" stroke-width="20" stroke-linecap="round" />
