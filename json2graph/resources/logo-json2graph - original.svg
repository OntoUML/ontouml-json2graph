    <circle cx="305" cy="92" r="27" fill="#2D3B87" />
    <circle cx="370" cy="205" r="27" fill="#2D3B87" />
    <circle cx="305" cy="318" r="27" fill="#2D3B87" />
    <circle cx="175" cy="318" r="27" fill="#EF551F" />
    <circle cx="110" cy="205" r="27" fill="#EF551F" />
  </g>
