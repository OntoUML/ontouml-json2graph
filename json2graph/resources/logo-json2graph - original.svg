    <line x1="175" y1="92" x2="305" y2="318" stroke="#959CC2" stroke-width="12" stroke-linecap="round" />
    <line x1="305" y1="92" x2="175" y2="318" stroke="#959CC2" stroke-width="12" stroke-linecap="round" />
    <!-- Paired conversion / transformation arcs. -->
