version: 2

updates:
  # Keep GitHub Actions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

    # CodeQL's init, autobuild, and analyze actions must be updated together.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Keep Python dependencies up to date using Poetry's
  # pyproject.toml and poetry.lock as the authoritative files.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

    # requirements.txt is generated from Poetry and must not be
    # updated independently.
    exclude-paths:
      - "requirements.txt"